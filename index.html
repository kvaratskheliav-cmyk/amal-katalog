<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Каталог Амал</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:#F2F2F7; padding-bottom:88px; }
.hdr { position:sticky; top:0; z-index:10; background:#fff; padding:10px 12px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
.hdr h1 { font-size:17px; color:#1C1C1E; display:flex; justify-content:space-between; align-items:center; }
.hdr h1 .upd { font-size:12px; color:#8E8E93; font-weight:400; }
.search { margin-top:8px; display:flex; gap:8px; }
.search input { flex:1; border:1px solid #E5E5EA; border-radius:10px; padding:9px 12px; font-size:15px; outline:none; background:#F2F2F7; }
.sug { position:relative; }
.sug-box { position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid #E5E5EA; border-radius:0 0 12px 12px; box-shadow:0 6px 16px rgba(0,0,0,.12); z-index:15; max-height:46vh; overflow-y:auto; display:none; }
.sug-box.open { display:block; }
.sug-row { display:flex; justify-content:space-between; align-items:center; padding:11px 14px; font-size:15px; color:#1C1C1E; border-bottom:1px solid #F2F2F7; }
.sug-row:active { background:#F2F2F7; }
.sug-row .sug-n { color:#8E8E93; font-size:13px; }
.sug-title { padding:9px 14px 3px; font-size:11px; font-weight:700; color:#8E8E93; text-transform:uppercase; letter-spacing:.4px; }
.hint { grid-column:1/-1; text-align:center; color:#8E8E93; padding:24px 10px 6px; font-size:14px; }
.hint .fix { display:inline-block; background:#F2E9E1; color:#8A4B2A; font-weight:700; border-radius:14px; padding:6px 14px; margin:6px 4px 0; }
.chips { display:flex; gap:6px; overflow-x:auto; padding:8px 0 2px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex:0 0 auto; border:1px solid #E5E5EA; background:#fff; border-radius:16px; padding:5px 12px; font-size:13px; color:#3A3A3C; }
.chip.on { background:#A32C26; color:#fff; border-color:#A32C26; }
.list { padding:10px 12px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.sec { grid-column:1/-1; font-size:13px; font-weight:700; color:#8E8E93; margin:6px 2px 0; text-transform:uppercase; letter-spacing:.4px; }
.card { background:#fff; border-radius:12px; padding:8px; display:flex; flex-direction:column; }
.card img { width:100%; aspect-ratio:1; object-fit:contain; border-radius:8px; background:#F2F2F7; }
.nm { font-size:13px; font-weight:600; color:#1C1C1E; line-height:1.25; margin:6px 0 2px; flex:1; }
.meta { font-size:11px; color:#8E8E93; }
.pr { font-size:16px; font-weight:800; color:#A32C26; margin:4px 0; }
.krat { font-size:11px; font-weight:700; color:#8A4B2A; background:#F2E9E1; border-radius:6px; padding:2px 8px; align-self:flex-start; margin-bottom:2px; }
.rowsum { font-size:12px; color:#3A3A3C; font-weight:600; min-height:15px; }
.qty { display:flex; align-items:center; gap:6px; margin-top:6px; }
.qty button { width:34px; height:34px; border:none; border-radius:8px; background:#F2F2F7; font-size:19px; color:#1C1C1E; font-weight:700; }
.qty input { flex:1; width:40px; text-align:center; border:1px solid #E5E5EA; border-radius:8px; padding:7px 2px; font-size:15px; font-weight:700; }
.cartbar { position:fixed; left:0; right:0; bottom:0; background:#fff; box-shadow:0 -2px 10px rgba(0,0,0,.12); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; align-items:center; gap:12px; z-index:20; }
.cartinfo { flex:1; }
.cartinfo .cnt { font-size:12px; color:#8E8E93; }
.cartinfo .sum { font-size:18px; font-weight:800; color:#1C1C1E; }
.sendbtn { background:#A32C26; color:#fff; border:none; border-radius:12px; padding:12px 20px; font-size:15px; font-weight:700; }
.sendbtn:disabled { background:#C7C7CC; }
.cartopen { background:#1C1C1E; color:#fff; border:none; border-radius:12px; padding:12px 18px; font-size:15px; font-weight:700; }
/* --- корзина (выезжающая панель) --- */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30; display:none; }
.sheet { position:fixed; left:0; right:0; bottom:0; max-height:82vh; background:#fff; border-radius:16px 16px 0 0; z-index:31; display:none; flex-direction:column; }
.sheet.open, .overlay.open { display:flex; }
.overlay.open { display:block; }
.sh-hdr { padding:14px 16px 8px; font-size:18px; font-weight:800; color:#1C1C1E; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #F2F2F7; }
.sh-close { background:none; border:none; font-size:22px; color:#8E8E93; padding:4px 8px; }
.sh-list { overflow-y:auto; padding:4px 14px; flex:1; }
.ci { display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid #F2F2F7; }
.ci img { width:52px; height:52px; object-fit:contain; background:#F2F2F7; border-radius:8px; flex:0 0 52px; }
.ci-mid { flex:1; min-width:0; }
.ci-nm { font-size:13px; font-weight:600; color:#1C1C1E; line-height:1.25; }
.ci-pr { font-size:12px; color:#8E8E93; margin-top:2px; }
.ci-sum { font-size:14px; font-weight:800; color:#A32C26; margin-top:2px; }
.ci-qty { display:flex; align-items:center; gap:6px; }
.ci-qty button { width:30px; height:30px; border:none; border-radius:8px; background:#F2F2F7; font-size:17px; font-weight:700; color:#1C1C1E; }
.ci-qty span { min-width:26px; text-align:center; font-size:15px; font-weight:700; }
.ci-del { background:none; border:none; color:#C7C7CC; font-size:19px; padding:4px 6px; }
.sh-ftr { padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid #F2F2F7; }
.sh-total { display:flex; justify-content:space-between; font-size:17px; font-weight:800; color:#1C1C1E; margin-bottom:10px; }
.sh-btns { display:flex; gap:10px; }
.sh-btns .sendbtn { flex:1; }
.backbtn { background:#F2F2F7; color:#1C1C1E; border:none; border-radius:12px; padding:12px 16px; font-size:15px; font-weight:700; }
.empty { grid-column:1/-1; text-align:center; color:#8E8E93; padding:40px 10px; font-size:14px; }
.nopric { text-align:center; padding:60px 16px; color:#8E8E93; font-size:15px; }
</style>
</head>
<body>
<div class="hdr">
  <h1>Каталог «Амал» <span class="upd" id="upd"></span></h1>
  <div class="search sug"><input id="q" type="search" placeholder="Поиск товара…" autocomplete="off">
    <div class="sug-box" id="sugbox"></div></div>
  <div class="chips" id="chips"></div>
</div>
<div class="list" id="list"></div>
<div class="cartbar" id="cartbar" style="display:none">
  <div class="cartinfo" onclick="openCart()"><div class="cnt" id="ccnt"></div><div class="sum" id="csum"></div></div>
  <button class="cartopen" onclick="openCart()">🧺 Корзина</button>
</div>
<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="sheet" id="sheet">
  <div class="sh-hdr">🧺 Ваш заказ <button class="sh-close" onclick="closeCart()">✕</button></div>
  <div class="sh-list" id="shlist"></div>
  <div class="sh-ftr">
    <div class="sh-total"><span>Итого:</span><span id="shtotal"></span></div>
    <div class="sh-btns">
      <button class="backbtn" onclick="closeCart()">← Вернуться</button>
      <button class="sendbtn" id="send">Отправить заказ</button>
    </div>
  </div>
</div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
// тип цен приходит из ссылки бота: ?t=o|k|r|s (или в start_param)
const params = new URLSearchParams(location.search);
let PT = params.get("t") || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
PT = (PT || "").replace(/[^koрrs]/g, "") || "";
const PT_NAMES = {k:"Крупный опт", o:"Опт", r:"Розничные", s:"Спец цена"};
let DATA = null, cart = {};   // cart: idx -> qty

const fmt = v => v.toLocaleString("ru-RU", {minimumFractionDigits:2, maximumFractionDigits:2}) + " ₽";
// латинские двойники кириллицы (в названиях из 1С встречается латинская C в «Cпагетти» и т.п.)
const HOMO = {"a":"а","c":"с","e":"е","o":"о","p":"р","x":"х","y":"у","k":"к","m":"м","t":"т","h":"н","b":"в"};
const normS = s => s.toLowerCase().replace(/[a-z]/g, ch => HOMO[ch] || ch);

// --- индекс слов каталога для подсказок ---
const SUGSTOP = new Set(["стекло","банка","лента","короб","коробе","блок","блоков","гр","кг","мл","лит","шт","для","пэт","дой","пак","вес"]);
let WORDS = {};   // ключ normS(слово) -> {d: как показывать, n: в скольких товарах}
function buildWordIndex() {
  WORDS = {};
  DATA.items.forEach(it => {
    if (!priceOf(it)) return;                 // только то, что реально видно клиенту
    const seen = new Set();
    it.n.toLowerCase().split(/[^а-яёa-z0-9]+/).forEach(w => {
      if (w.length < 3 || /^\d+$/.test(w)) return;
      const key = normS(w);
      if (SUGSTOP.has(key) || seen.has(key)) return;
      seen.add(key);
      if (!WORDS[key]) WORDS[key] = {d: w, n: 0};
      WORDS[key].n += 1;
    });
  });
}
function lev(a, b) {                          // расстояние Левенштейна (для опечаток)
  if (Math.abs(a.length - b.length) > 2) return 9;
  const m = a.length, n = b.length;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function suggestions(q) {
  const keys = Object.keys(WORDS);
  const pref = keys.filter(k => k.startsWith(q) && k !== q);
  const sub = keys.filter(k => !k.startsWith(q) && k.includes(q));
  const rank = arr => arr.sort((x, y) => WORDS[y].n - WORDS[x].n);
  return rank(pref).concat(rank(sub)).slice(0, 6);
}
function typoFixes(q) {
  return Object.keys(WORDS)
    .map(k => [k, lev(q, k)]).filter(([k, d]) => d > 0 && d <= 2)
    .sort((a, b) => a[1] - b[1] || WORDS[b[0]].n - WORDS[a[0]].n)
    .slice(0, 3).map(([k]) => k);
}
function showSug(list, title) {
  const box = document.getElementById("sugbox");
  if (!list.length) { box.classList.remove("open"); box.innerHTML = ""; return; }
  box.innerHTML = (title ? '<div class="sug-title">' + title + '</div>' : "") +
    list.map(k => '<div class="sug-row" onmousedown="pickSug(\'' + k + '\')">' +
      '<span>' + esc(WORDS[k].d) + '</span><span class="sug-n">' + WORDS[k].n + '</span></div>').join("");
  box.classList.add("open");
}
function hideSug() { document.getElementById("sugbox").classList.remove("open"); }
function pickSug(k) {
  const inp = document.getElementById("q");
  inp.value = WORDS[k] ? WORDS[k].d : k;
  query = k; hideSug(); render();
}
function popular() {
  return Object.keys(WORDS).filter(k => k.length >= 4)
    .sort((a, b) => WORDS[b].n - WORDS[a].n).slice(0, 10);
}

fetch("data.json").then(r => r.json()).then(d => { DATA = d; init(); })
  .catch(() => { document.getElementById("list").innerHTML = '<div class="empty">Не удалось загрузить каталог. Проверьте интернет и откройте заново.</div>'; });

let activeGroup = "", query = "";
function init() {
  document.getElementById("upd").textContent = "цены на " + DATA.updated;
  if (!PT || !PT_NAMES[PT]) {
    document.body.innerHTML = '<div class="nopric">Откройте каталог кнопкой в боте <b>@amal_katalog_bot</b> — тогда будут видны ваши цены.</div>';
    return;
  }
  const groups = [...new Set(DATA.items.map(i => i.g))];
  const chips = document.getElementById("chips");
  const mk = (label, val) => {
    const b = document.createElement("button"); b.className = "chip" + (val === activeGroup ? " on" : "");
    b.textContent = label; b.onclick = () => { activeGroup = val; render(); paint(); };
    chips.appendChild(b); return b;
  };
  function paint() {
    [...chips.children].forEach((c, i) => c.className = "chip" + ((i === 0 ? "" : groups[i-1]) === activeGroup ? " on" : ""));
  }
  mk("Все", "");
  groups.forEach(g => mk(g.replace(/^\S+\s/, ""), g));
  buildWordIndex();
  const qinp = document.getElementById("q");
  qinp.addEventListener("input", e => {
    query = normS(e.target.value.trim());
    render();
    if (!query) { showSug(popular(), "Популярное"); }
    else if (query.length >= 2) { showSug(suggestions(query), ""); }
    else hideSug();
  });
  qinp.addEventListener("focus", () => { if (!query) showSug(popular(), "Популярное"); });
  qinp.addEventListener("blur", () => setTimeout(hideSug, 250));
  document.getElementById("send").onclick = sendOrder;
  render();
  const cartParam = params.get("cart");
  if (cartParam) restoreCart(cartParam);
  else {
    // корзина, отложенная при попытке заказа из кнопки меню
    try {
      const st = localStorage.getItem("amal_stash_" + PT);
      if (st) { localStorage.removeItem("amal_stash_" + PT); restoreCart(st); }
    } catch (e) {}
  }
}

function priceOf(it) { return (it.pr && it.pr[PT]) || 0; }

// --- повтор прошлого заказа: ?cart=ключ.колво,... (ключ = штрихкод или h+хэш имени) ---
function djb2(s) {
  let h = 5381 >>> 0;
  for (const ch of String(s)) h = (((h * 33) >>> 0) + ch.codePointAt(0)) >>> 0;
  return h.toString(16).padStart(8, "0");
}
function keyOf(it) {
  const bc = String(it.b || "").replace(/\D/g, "");
  return bc.length >= 8 ? bc : "h" + djb2(it.n1c || it.n);
}
function restoreCart(param) {
  const keyIdx = {};
  DATA.items.forEach((it, idx) => { if (priceOf(it)) keyIdx[keyOf(it)] = idx; });
  let ok = 0, miss = 0;
  param.split(",").forEach(pair => {
    const d = pair.lastIndexOf(".");
    if (d < 1) return;
    const k = pair.slice(0, d), q = parseFloat(pair.slice(d + 1));
    const idx = keyIdx[k];
    if (idx === undefined || !(q > 0)) { miss++; return; }
    setq(idx, q); ok++;
  });
  if (ok) {
    const note = document.createElement("div");
    note.className = "toc-note";
    note.style.cssText = "background:#E8F5E9;color:#1B5E20;padding:8px 12px;font-size:13px;";
    note.textContent = "↻ Прошлый заказ восстановлен: " + ok + " поз." +
      (miss ? " (" + miss + " недоступны — их нет в наличии)" : "") +
      " Проверьте корзину и отправьте.";
    document.querySelector(".hdr").appendChild(note);
  }
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  let lastSec = null, shown = 0;
  DATA.items.forEach((it, idx) => {
    if (activeGroup && it.g !== activeGroup) return;
    if (query && !normS(it.n).includes(query)) return;
    const price = priceOf(it);
    if (!price) return;                    // без цены этого типа не показываем
    if (it.s !== lastSec) {
      lastSec = it.s;
      const s = document.createElement("div"); s.className = "sec"; s.textContent = it.s;
      list.appendChild(s);
    }
    const qty = cart[idx] || 0;
    const k = it.k || 0;
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML =
      '<img loading="lazy" src="' + it.i + '">' +
      '<div class="nm">' + esc(it.n) + '</div>' +
      '<div class="meta">' + esc(it.c) + (it.p ? " · " + esc(it.p) : "") + '</div>' +
      '<div class="pr">' + fmt(price) + '</div>' +
      (k > 1 ? '<div class="krat">коробка ' + k + ' шт — заказ кратно ' + k + '</div>' : '') +
      '<div class="rowsum" id="rs' + idx + '">' + (qty ? "= " + fmt(qty * price) : "") + '</div>' +
      '<div class="qty">' +
        '<button onclick="chg(' + idx + ',-1)">−</button>' +
        '<input id="q' + idx + '" type="number" min="0" step="' + (k > 1 ? k : 1) + '" inputmode="numeric" value="' + (qty || "") + '" placeholder="0" onchange="setq(' + idx + ',this.value)">' +
        '<button onclick="chg(' + idx + ',1)">+</button>' +
      '</div>';
    list.appendChild(card); shown++;
  });
  if (!shown) {
    let html = '<div class="empty">Ничего не найдено</div>';
    if (query && query.length >= 4) {
      const fixes = typoFixes(query);
      if (fixes.length)
        html = '<div class="hint">Ничего не найдено. Возможно, вы искали:<br>' +
          fixes.map(k => '<span class="fix" onclick="pickSug(\'' + k + '\')">' +
            esc(WORDS[k].d) + '</span>').join("") + '</div>';
    }
    list.innerHTML = html;
  }
  updateCart();
}

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function kOf(it) { return (it.k && it.k > 1) ? it.k : 1; }   // шаг заказа = кратность (коробка)
function chg(idx, d) {
  setq(idx, (cart[idx] || 0) + d * kOf(DATA.items[idx]));    // «+/−» шагает по коробке
}
function setq(idx, v) {
  const st = kOf(DATA.items[idx]);
  v = Math.max(0, Math.floor(Number(v) || 0));
  if (v) v = Math.max(st, Math.round(v / st) * st);          // заказ только кратно коробке
  if (v) cart[idx] = v; else delete cart[idx];
  const el = document.getElementById("q" + idx); if (el) el.value = v || "";
  const rs = document.getElementById("rs" + idx);
  if (rs) rs.textContent = v ? "= " + fmt(v * priceOf(DATA.items[idx])) : "";
  updateCart();
}
function updateCart() {
  const idxs = Object.keys(cart);
  const bar = document.getElementById("cartbar");
  if (!idxs.length) { bar.style.display = "none"; closeCart(); return; }
  let total = 0, n = 0;
  idxs.forEach(i => { total += cart[i] * priceOf(DATA.items[i]); n += 1; });
  bar.style.display = "flex";
  document.getElementById("ccnt").textContent = "Позиций: " + n;
  document.getElementById("csum").textContent = "Итого: " + fmt(total);
  if (document.getElementById("sheet").classList.contains("open")) renderCartSheet();
}

function openCart() { renderCartSheet();
  document.getElementById("sheet").classList.add("open");
  document.getElementById("overlay").classList.add("open"); }
function closeCart() {
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("overlay").classList.remove("open"); }

function cartChg(idx, d) {
  setq(idx, (cart[idx] || 0) + d * kOf(DATA.items[idx])); // тот же шаг-коробка + синхронизация
}

function renderCartSheet() {
  const list = document.getElementById("shlist");
  list.innerHTML = "";
  let total = 0;
  Object.keys(cart).forEach(i => {
    const it = DATA.items[i], q = cart[i], pr = priceOf(it), s = q * pr;
    total += s;
    const row = document.createElement("div"); row.className = "ci";
    row.innerHTML =
      '<img loading="lazy" src="' + it.i + '">' +
      '<div class="ci-mid"><div class="ci-nm">' + esc(it.n) + '</div>' +
      '<div class="ci-pr">' + fmt(pr) + ' × ' + q + '</div>' +
      '<div class="ci-sum">= ' + fmt(s) + '</div></div>' +
      '<div class="ci-qty"><button onclick="cartChg(' + i + ',-1)">−</button>' +
      '<span>' + q + '</span>' +
      '<button onclick="cartChg(' + i + ',1)">+</button></div>' +
      '<button class="ci-del" onclick="setq(' + i + ',0)">✕</button>';
    list.appendChild(row);
  });
  document.getElementById("shtotal").textContent = fmt(total);
}
function sendOrder() {
  // страховка: заказ не уходит, если где-то количество не кратно коробке
  const bad = Object.keys(cart).filter(i => cart[i] % kOf(DATA.items[i]) !== 0);
  if (bad.length) {
    bad.forEach(i => setq(Number(i), cart[i]));   // подравнять до кратного
    alert("Количество подравнено до целых коробок:\n" +
      bad.map(i => "• " + DATA.items[i].n + " — по " + kOf(DATA.items[i]) + " шт").join("\n") +
      "\nПроверьте заказ и отправьте ещё раз.");
    return;
  }
  const items = Object.keys(cart).map(i => [Number(i), cart[i]]);
  if (!items.length) return;
  const payload = JSON.stringify({v:1, t:PT, items:items});
  // из кнопки МЕНЮ Telegram не даёт отправить заказ (sendData только у reply-кнопки):
  // сохраняем корзину и просим открыть красной кнопкой — там она восстановится
  const fromMenu = !!(tg && tg.initData);
  if (tg && tg.sendData && !fromMenu) { tg.sendData(payload); }
  else if (fromMenu) {
    try {
      localStorage.setItem("amal_stash_" + PT,
        Object.keys(cart).map(i => keyOf(DATA.items[i]) + "." + cart[i]).join(","));
    } catch (e) {}
    alert("Корзина сохранена! Отправка заказа работает из кнопки «🔴 Открыть каталог» внизу чата: закройте каталог и откройте его этой кнопкой — корзина восстановится, останется нажать «Отправить заказ».");
  }
  else alert("Откройте каталог из бота @amal_katalog_bot, чтобы отправить заказ.");
}
</script>
</body>
</html>
